<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    ACCA TX: Ubuntu / LibreOffice conversion font fallbacks.
    Install as ~/.config/fontconfig/conf.d/99-acca-fonts.conf (or under
    /etc/fonts/conf.d/). This is a configuration fragment, not a replacement
    for /etc/fonts/fonts.conf; do not point FONTCONFIG_FILE at this file alone.

    Expected packages: fonts-liberation2, fonts-crosextra-carlito,
    fonts-crosextra-caladea, fonts-noto-cjk, fonts-dejavu-core,
    fonts-opensymbol and fonts-texgyre. Original Microsoft core fonts may
    additionally be installed by the conversion workflow.

    Alias "accept" puts a replacement after the requested family, so an
    installed original font (including Times New Roman / Arial) wins.
    The unusual Bold/Regular family names are normalized before aliasing.
    OOXML theme placeholders (+mj-lt, +mn-ea, etc.) belong to the document
    theme and deliberately receive no fontconfig mapping here.
  -->

  <match target="pattern">
    <test name="family" compare="eq"><string>Times New Roman Bold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Times New Roman</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Times New Roman Regular</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Times New Roman</string></edit>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Source Han Sans CN Regular</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Source Han Sans CN</string></edit>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>思源黑体 CN Regular</string></test>
    <edit name="family" mode="assign" binding="strong"><string>思源黑体 CN</string></edit>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>思源黑体 CN Heavy</string></test>
    <edit name="family" mode="assign" binding="strong"><string>思源黑体 CN</string></edit>
    <edit name="weight" mode="assign"><const>black</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Calibri Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Calibri</string></edit>
    <edit name="weight" mode="assign"><const>light</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>等线 Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>等线</string></edit>
    <edit name="weight" mode="assign"><const>light</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Heiti SC Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Heiti SC</string></edit>
    <edit name="weight" mode="assign"><const>light</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Arial Narrow</string></test>
    <edit name="width" mode="assign"><const>condensed</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Britannic Bold</string></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>

  <!-- Latin fonts: prefer metric-compatible substitutes where available. -->
  <alias binding="strong">
    <family>Times New Roman</family>
    <accept><family>Liberation Serif</family><family>TeX Gyre Termes</family><family>Noto Serif CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>Arial</family>
    <accept><family>Liberation Sans</family><family>Noto Sans CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>Arial Narrow</family>
    <accept><family>Liberation Sans Narrow</family><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="strong">
    <family>Arial Unicode MS</family>
    <accept><family>Arial</family><family>Liberation Sans</family><family>Noto Sans CJK SC</family><family>DejaVu Sans</family></accept>
  </alias>
  <alias binding="strong">
    <family>Calibri</family>
    <accept><family>Carlito</family><family>Liberation Sans</family><family>Noto Sans CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>Cambria</family>
    <accept><family>Caladea</family><family>Liberation Serif</family></accept>
  </alias>
  <alias binding="strong">
    <family>Helvetica</family>
    <accept><family>Arial</family><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="strong">
    <family>Verdana</family>
    <accept><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="strong">
    <family>Trebuchet MS</family>
    <accept><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="strong">
    <family>Lucida Grande</family>
    <accept><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="strong">
    <family>Britannic Bold</family>
    <accept><family>DejaVu Sans</family><family>Liberation Sans</family></accept>
  </alias>

  <!-- Simplified Chinese serif / Song faces. -->
  <alias binding="strong">
    <family>宋体</family>
    <accept><family>Noto Serif CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>SimSun</family>
    <accept><family>Noto Serif CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>华文宋体</family>
    <accept><family>Noto Serif CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>STSong</family>
    <accept><family>Noto Serif CJK SC</family></accept>
  </alias>

  <!-- Simplified Chinese sans faces. Noto CJK shares Source Han's design. -->
  <alias binding="strong">
    <family>思源黑体 CN</family>
    <accept><family>Noto Sans CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>Source Han Sans CN</family>
    <accept><family>Noto Sans CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>等线</family>
    <accept><family>Noto Sans CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>DengXian</family>
    <accept><family>Noto Sans CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>微软雅黑</family>
    <accept><family>Noto Sans CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>Microsoft YaHei</family>
    <accept><family>Noto Sans CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>华文细黑</family>
    <accept><family>Noto Sans CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>STXihei</family>
    <accept><family>Noto Sans CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>黑体</family>
    <accept><family>Noto Sans CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>SimHei</family>
    <accept><family>Noto Sans CJK SC</family></accept>
  </alias>
  <alias binding="strong">
    <family>Heiti SC</family>
    <accept><family>Noto Sans CJK SC</family></accept>
  </alias>

  <!--
    Mathematical and legacy symbol faces are approximate fallbacks.
    Fontconfig cannot remap Wingdings/Symbol legacy character encodings;
    formulas, bullets and special symbols must be checked in rendered PDFs.
    DejaVu Math TeX Gyre / TeX Gyre Termes Math require their own matching
    font package if not supplied by the distribution's fonts-texgyre build.
  -->
  <alias binding="strong">
    <family>Cambria Math</family>
    <accept><family>DejaVu Math TeX Gyre</family><family>TeX Gyre Termes Math</family><family>DejaVu Serif</family></accept>
  </alias>
  <alias binding="strong">
    <family>DejaVu Math TeX Gyre</family>
    <accept><family>TeX Gyre Termes Math</family><family>DejaVu Serif</family></accept>
  </alias>
  <alias binding="strong">
    <family>Wingdings</family>
    <accept><family>OpenSymbol</family><family>DejaVu Sans</family></accept>
  </alias>
  <alias binding="strong">
    <family>Symbol</family>
    <accept><family>OpenSymbol</family><family>DejaVu Sans</family></accept>
  </alias>
</fontconfig>
