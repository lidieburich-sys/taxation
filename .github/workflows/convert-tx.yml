name: Convert TX PowerPoint to PDF

on:
  workflow_dispatch:
    inputs:
      repair_only:
        description: Reuse verified PDFs unless a compatibility repair is needed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: convert-tx
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install conversion tools and fonts
        run: |
          sudo apt-get update -qq
          echo 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true' | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libreoffice-impress poppler-utils fonts-liberation2 fonts-crosextra-carlito fonts-crosextra-caladea fonts-noto-cjk fonts-dejavu-core fonts-dejavu-extra fonts-opensymbol fonts-texgyre ttf-mscorefonts-installer
          mkdir -p ~/.config/fontconfig/conf.d
          cp .github/scripts/fonts.conf ~/.config/fontconfig/conf.d/99-tx-fonts.conf
          fc-cache -f
          python3 -m venv /tmp/tx-venv
          /tmp/tx-venv/bin/pip install 'PyMuPDF==1.26.7' Pillow lxml
      - name: Download source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            ready=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/tx-source-2026" --jq '[.assets[] | select(.state == "uploaded")] | length' 2>/dev/null || echo 0)
            if [ "$ready" = 7 ]; then
              gh release download tx-source-2026 --repo "$GITHUB_REPOSITORY" --dir source-assets
              exit 0
            fi
            echo "Waiting for source upload: $ready / 7 assets"
            sleep 10
          done
          echo 'Source upload did not finish in time.' >&2
          exit 1
      - name: Convert and verify all decks
        env:
          REPAIR_ONLY: ${{ inputs.repair_only }}
        run: /tmp/tx-venv/bin/python .github/scripts/convert.py
      - name: Save visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tx-pdf-visual-checks
          path: |
            qa/
            metadata/conversion-report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Store PDFs in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ':(top,glob)*.pdf' README.md metadata/conversion-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add 50 TX PDFs and original exam tax table'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
